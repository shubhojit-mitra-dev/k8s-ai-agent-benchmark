[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "k8s-ai-agent-benchmark"
version = "1.0.0"
description = "Research-grade Kubernetes AI Agent Benchmark: Jev + Claude Sonnet 5 Hybrid vs Claude Sonnet 5 Baseline"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Academic Evaluation Engineering Group" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "sse-starlette>=2.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "click>=8.1.0",
    "pytest>=8.0.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
